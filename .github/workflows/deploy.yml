name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No se cancelan los que ya estén en marcha: si dos
# pushes llegan juntos, interesa que el segundo espere y no que el primero
# quede a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/configure-pages@v5

      # `next build` con output: export deja el sitio en out/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
